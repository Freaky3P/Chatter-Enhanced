name: Package and Publish Addon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure zip tool is available
        run: sudo apt-get update && sudo apt-get install -y zip >/dev/null

      - name: Create addon zip
        run: |
          TAG=${GITHUB_REF_NAME}
          ZIP_NAME="Chatter_${TAG}.zip"
          echo "Packaging Chatter/ into $ZIP_NAME"
          rm -f "$ZIP_NAME"
          # Only include the Chatter folder so the zip is a drop-in addon package
          zip -r "$ZIP_NAME" Chatter
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create GitHub release and upload asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
